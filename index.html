<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f4"><title>Constituția Republicii Moldova</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7e2;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#f8f7f4;padding:24px 22px 34px}.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:48px}.top .mid{text-align:center;font-weight:650}.icon{border:0;background:transparent;font-size:30px;padding:4px;cursor:pointer}.heroTitle{font-size:34px;line-height:1.08;margin:12px 0 6px}.sub{color:#737078;font-size:18px}.hero{width:100%;height:185px;object-fit:cover;border-radius:22px;margin:20px 0}.card{width:100%;border:0;border-radius:22px;padding:20px;margin:0 0 14px;text-align:left;background:white;box-shadow:0 7px 24px #0000000c;display:flex;gap:15px;align-items:center}.card.dark{background:#171717;color:#fff}.card b{font-size:20px;display:block}.card small{font-size:14px;color:#777}.card.dark small{color:#bbb}.ico{width:48px;height:48px;border-radius:50%;background:#efedf5;display:grid;place-items:center;font-size:24px}.grow{flex:1}.chev{font-size:30px}.settings{position:relative}.pop{position:absolute;right:0;top:44px;background:#fff;border-radius:16px;padding:8px;box-shadow:0 10px 30px #0002;z-index:5}.pop button{border:0;background:transparent;padding:10px 14px;border-radius:10px}.pop .on{background:#efedf5}.progress{height:8px;background:#dddde0;border-radius:10px;overflow:hidden;margin:14px 0 10px}.progress i{display:block;height:100%;background:#111;border-radius:10px}.timerrow{text-align:right}.timer{display:inline-block;background:#eeedf4;padding:8px 12px;border-radius:12px;font-weight:650;color:#45414d}.question{font-size:31px;line-height:1.18;font-weight:650;margin:24px 0 14px}.translate{border:0;background:#efedf5;padding:10px 14px;border-radius:12px;font-weight:650}.translation{background:#f0eff5;padding:14px;border-radius:14px;margin-top:8px;font-size:16px}.answers{background:#121212;border-radius:28px;padding:18px;margin:24px -22px -34px;min-height:340px}.option{width:100%;border:1px solid #777;border-radius:16px;background:#151515;color:white;padding:16px;margin:0 0 10px;display:grid;grid-template-columns:42px 1fr;text-align:left;align-items:center;font-size:17px;line-height:1.25}.option.selected{border-color:#aaa;background:#30303a}.option.good{background:#315d49;border-color:#78b894}.option.bad{background:#713e3e;border-color:#c78080}.letter{font-size:19px}.feedback{color:#fff;font-weight:750;font-size:18px;margin:12px 4px}.next,.primary{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:750;background:#fff;color:#111}.primary{background:#171717;color:#fff;margin-top:18px}.intro{padding:34px 4px}.big{font-size:54px;font-weight:800}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.grid button{aspect-ratio:1;border:0;border-radius:12px}.grid .done{background:#262626;color:#fff}.stats{display:grid;gap:12px;margin-top:24px}.stat{background:#fff;padding:18px;border-radius:18px}.heart.saved{color:#504b75}.error{padding:20px;color:#8b2020;white-space:pre-wrap}</style></head><body><div id="app"></div><script>const Q=[{"id": 1, "question": {"ro": "Caracteristicile statului Republica Moldova consacrate în Constituție sunt:", "ru": "Характеристики государства Республика Молдова, закреплённые в Конституции, следующие:"}, "options": [{"key": "A", "ro": "stat suveran, independent, social și inovațional;", "ru": "суверенное, независимое, социальное и инновационное государство;"}, {"key": "B", "ro": "stat suveran, independent, unitar, indivizibil, de drept, democratic;", "ru": "суверенное, независимое, унитарное, неразделимое, правовое, демократическое государство;"}, {"key": "C", "ro": "stat suveran, independent, unitar descentralizat;", "ru": "суверенное, независимое, унитарное децентрализованное государство;"}, {"key": "D", "ro": "stat suveran, independent, social și laic.", "ru": "суверенное, независимое, социальное и светское государство."}], "correct": "B"}, {"id": 2, "question": {"ro": "Sub aspect administrativ, teritoriul Republicii Moldova este organizat în:", "ru": "С административной точки зрения территория Республики Молдова организована в:"}, "options": [{"key": "A", "ro": "regiuni, raioane, orașe, sate, noduri de cale ferată, unitatea teritorială autonomă Găgăuzia;", "ru": "регионы, районы, города, сёла, железнодорожные узлы, автономная территориальная единица Гагаузия;"}, {"key": "B", "ro": "regiuni, raioane, orașe și sate;", "ru": "регионы, районы, города и сёла;"}, {"key": "C", "ro": "sate, orașe, raioane, unitatea teritorială autonomă Găgăuzia.", "ru": "сёла, города, районы, автономная территориальная единица Гагаузия"}], "correct": "C"}, {"id": 3, "question": {"ro": "Care din următoarele îndatoriri nu este consacrată în Constituția Republicii Moldova:", "ru": "Какая из следующих обязанностей не закреплена в Конституции Республики Молдова:"}, "options": [{"key": "A", "ro": "devotament față de țară;", "ru": "преданность стране;"}, {"key": "B", "ro": "conservarea și ocrotirea monumentelor istorice și culturale;", "ru": "сохранение и охрана исторических и культурных памятников;"}, {"key": "C", "ro": "îndatorirea de a munci.", "ru": "обязанность работать"}], "correct": "C"}, {"id": 4, "question": {"ro": "Poporul Republicii Moldova exercită suveranitatea:", "ru": "Народ Республики Молдова осуществляет суверенитет:"}, "options": [{"key": "A", "ro": "prin organele sale reprezentative, prin referendum și prin adunările cetățenilor;", "ru": "через свои представительные органы, через референдум и собрания граждан;"}, {"key": "B", "ro": "prin organele sale reprezentative, prin referendum și prin Adunarea Națională;", "ru": "через свои представительные органы, через референдум и через Национальное Собрание;"}, {"key": "C", "ro": "în mod direct și prin organele sale reprezentative, în formele stabilite de Constituție;", "ru": "непосредственно и через свои представительные органы в формах, установленных Конституцией;"}, {"key": "D", "ro": "în mod direct și prin organele sale reprezentative, în modul stabilit de Codul electoral", "ru": "непосредственно и через свои представительные органы в порядке, установленном Избирательным кодексом"}], "correct": "C"}, {"id": 5, "question": {"ro": "În Republica Moldova percheziționarea, reținerea sau arestarea unei persoane sunt premise:", "ru": "В Республике Молдова обыск, задержание или арест лица допускаются:"}, "options": [{"key": "A", "ro": "numai în cazul săvârșirii unei infracțiuni;", "ru": "только в случае совершения преступления;"}, {"key": "B", "ro": "numai în cazurile și cu procedura prevăzute de lege;", "ru": "только в случаях и с процедурой, предусмотренными законом;"}, {"key": "C", "ro": "numai în cazul săvârșirii unei contravenții, în baza mandatului emis de instanța de judecată;", "ru": "только в случае совершения правонарушения, на основании ордера, выданного судом;"}, {"key": "D", "ro": "numai în cazul în care este nevoie de identificare, cu procedura prevăzută de lege.", "ru": "только в случае необходимости идентификации, с процедурой, предусмотренной законом."}], "correct": "B"}, {"id": 6, "question": {"ro": "Membrii Guvernului Republicii Moldova depun jurământul în fața:", "ru": "Члены Правительства Республики Молдова приносят присягу перед:"}, "options": [{"key": "A", "ro": "Parlamentului;", "ru": "Парламентом;"}, {"key": "B", "ro": "Curții Constituționale;", "ru": "Конституционным судом;"}, {"key": "C", "ro": "Președintelui Republicii Moldova;", "ru": "Президентом Республики Молдова;"}, {"key": "D", "ro": "Parlamentului și a Curții Constituționale.", "ru": "Парламентом и Конституционным судом."}], "correct": "C"}, {"id": 7, "question": {"ro": "Conform Constituției Republicii Moldova, cetățenii au dreptul să se adreseze autorităților publice prin petiții:", "ru": "Согласно Конституции Республики Молдова, граждане имеют право обращаться к органам государственной власти с петициями:"}, "options": [{"key": "A", "ro": "doar în cazul în care sunt formulate în numele semnatarilor;", "ru": "только в том случае, если они сформулированы от имени подписавших;"}, {"key": "B", "ro": "doar în cazul în care sunt întocmite în limba română;", "ru": "только в том случае, если они составлены на румынском языке;"}, {"key": "C", "ro": "doar în cazul în care sunt încălcate anumite drepturi.", "ru": "только в том случае, если нарушены определённые права"}], "correct": "A"}, {"id": 8, "question": {"ro": "Avocatul Poporului din Republica Moldova poate fi revocat din funcție:", "ru": "Уполномоченный по правам человека (Avocatul Poporului) в Республике Молдова может быть освобождён от должности:"}, "options": [{"key": "A", "ro": "la cererea Președintelui Republicii Moldova;", "ru": "по просьбе Президента Республики Молдова;"}, {"key": "B", "ro": "prin hotărârea Parlamentului, adoptată cu votul a 2/3 din deputații aleși;", "ru": "постановлением Парламента, принятым 2/3 голосов избранных депутатов;"}, {"key": "C", "ro": "la cererea Consiliului Superior al Magistraturii, cu votul a 2/3 din membri.", "ru": "по просьбе Высшего совета магистратуры, 2/3 голосов членов"}], "correct": "B"}, {"id": 9, "question": {"ro": "Alegerile deputaților în Parlamentul Republicii Moldova se desfășoară:", "ru": "Выборы депутатов в Парламент Республики Молдова проводятся:"}, "options": [{"key": "A", "ro": "în cel mult 2 luni de la expirarea mandatului sau de la dizolvarea Parlamentului precedent;", "ru": "не позднее 2 месяцев с истечения срока полномочий или с роспуска предыдущего Парламента;"}, {"key": "B", "ro": "în cel mult 90 de zile de la dizolvarea Parlamentului precedent;", "ru": "не позднее 90 дней с роспуска предыдущего Парламента;"}, {"key": "C", "ro": "în cel mult 60 de zile de la expirarea mandatului;", "ru": "не позднее 60 дней с истечения срока полномочий;"}, {"key": "D", "ro": "în cel mult 3 luni de la expirarea mandatului sau de la dizolvarea Parlamentului precedent", "ru": "не позднее 3 месяцев с истечения срока полномочий или с роспуска предыдущего Парламента"}], "correct": "D"}, {"id": 10, "question": {"ro": "Președintele Parlamentului Republicii Moldova poate fi revocat:", "ru": "Председатель Парламента Республики Молдова может быть отстранён:"}, "options": [{"key": "A", "ro": "cu majoritatea voturilor deputaților aleși;", "ru": "большинством голосов избранных депутатов;"}, {"key": "B", "ro": "cu o majoritate de cel puțin trei cincimi din voturile tuturor deputaților;", "ru": "большинством не менее трёх пятых от голосов всех депутатов;"}, {"key": "C", "ro": "cu o majoritate de cel puțin două treimi din voturile tuturor deputaților.", "ru": "большинством не менее двух третей от голосов всех депутатов"}], "correct": "C"}, {"id": 11, "question": {"ro": "Parlamentul Republicii Moldova se întrunește:", "ru": "Парламент Республики Молдова собирается:"}, "options": [{"key": "A", "ro": "oricând este nevoie, la solicitarea deputaților;", "ru": "когда угодно по запросу депутатов;"}, {"key": "B", "ro": "într-o singură sesiune pe durata mandatului;", "ru": "в одну сессию на протяжении срока полномочий;"}, {"key": "C", "ro": "în două sesiuni ordinare pe an;", "ru": "в две обычные сессии в год;"}, {"key": "D", "ro": "oricând este nevoie, la solicitarea Președintelui Parlamentului", "ru": "когда угодно по запросу Председателя Парламента."}], "correct": "C"}, {"id": 12, "question": {"ro": "Pământul, subsolul, apele, alte resurse naturale aflate pe teritoriul unității teritoriale autonome Găgăuzia sunt proprietatea:", "ru": "Земля, недра, воды и другие природные ресурсы, расположенные на территории автономной территориальной единицы Гагаузия, являются собственностью:"}, "options": [{"key": "A", "ro": "locuitorilor din unitatea teritorială autonomă Găgăuzia;", "ru": "жителей автономной территориальной единицы Гагаузия;"}, {"key": "B", "ro": "organelor administrației publice locale din unitatea teritorială autonomă Găgăuzia;", "ru": "органов местного управления автономной территориальной единицы Гагаузия;"}, {"key": "C", "ro": "poporului Republicii Moldova.", "ru": "народа Республики Молдова."}], "correct": "C"}, {"id": 13, "question": {"ro": "Care din autoritățile publice indicate mai jos nu dispune de dreptul la inițiativă legislativă:", "ru": "Какая из указанных ниже органов государственной власти не обладает правом законодательной инициативы:"}, "options": [{"key": "A", "ro": "Președintele Republicii Moldova;", "ru": "Президент Республики Молдова;"}, {"key": "B", "ro": "Consiliul Superior al Magistraturii;", "ru": "Высший совет магистратуры;"}, {"key": "C", "ro": "Guvernul Republicii Moldova;", "ru": "Правительство Республики Молдова;"}, {"key": "D", "ro": "Adunarea Populară a unității teritoriale autonome Găgăuzia.", "ru": "Народное собрание автономной территориальной единицы Гагаузия."}], "correct": "B"}, {"id": 14, "question": {"ro": "Potrivit Constituției Republici Moldova, legile ordinare se adoptă:", "ru": "Согласно Конституции Республики Молдова, обычные законы принимаются:"}, "options": [{"key": "A", "ro": "cu votul majorității deputaților aleși;", "ru": "голосованием большинства избранных депутатов;"}, {"key": "B", "ro": "cu votul a cel puțin două treimi din deputații aleși;", "ru": "голосованием не менее двух третей избранных депутатов;"}, {"key": "C", "ro": "cu votul majorității deputaților prezenți la ședință.", "ru": "голосованием большинства депутатов, присутствующих на заседании"}], "correct": "C"}, {"id": 15, "question": {"ro": "În exercitarea atribuțiilor sale, Guvernul Republicii Moldova se conduce de programul său de activitate, acceptat de către:", "ru": "При осуществлении своих полномочий Правительство Республики Молдова руководствуется своей программой деятельности, принятой:"}, function startTrain(favs){let pool=favs?Q.filter(q=>S.star.includes(q.id)):Q;if(!pool.length){alert(t('empty'));return}session={type:'train',pool,unseen:shuffle(pool.map(q=>q.id)),q:null,sel:null,checked:false,rus:false,count:0};nextTrain()}function chooseTrain(){if(!session.unseen.length)session.unseen=shuffle(session.pool.map(q=>q.id));let weak=session.pool.filter(q=>st(q.id).seen>0&&q.id!==session.q?.id);let useWeak=session.count>1&&session.count%3===0&&weak.length;if(useWeak){let bag=[];weak.forEach(q=>{let x=st(q.id),w=Math.max(1,1+x.wrong*3-x.streak);for(let i=0;i<w;i++)bag.push(q)});return bag[Math.floor(Math.random()*bag.length)]}let id=session.unseen.shift();return session.pool.find(q=>q.id===id)}function nextTrain(){session.q=chooseTrain();session.sel=null;session.checked=false;session.rus=false;session.count++;renderTrain()}function renderTrain(){let q=session.q,seen=session.pool.filter(q=>st(q.id).seen>0).length,pct=seen/session.pool.length*100;render(`<div class="app">${top('<button class="icon" onclick="home()">‹</button>',`${seen} / ${session.pool.length}`,heart(q,'renderTrain()'))}<div class="progress"><i style="width:${pct}%"></i></div><div class="question">${q.question.ro}</div><button class="translate" onclick="session.rus=!session.rus;renderTrain()">Rusă ${session.rus?'⌃':'⌄'}</button>${session.rus?`<div class="translation">${q.question.ru}</div>`:''}<div class="answers">${q.options.map(o=>optTrain(o,q)).join('')}${session.checked?`<div class="feedback">${session.sel===q.correct?t('correct'):t('wrong')}</div><button class="next" onclick="nextTrain()">${t('next')} →</button>`:''}</div></div>`)}function optTrain(o,q){let c='option';if(session.sel===o.key)c+=' selected';if(session.checked&&o.key===q.correct)c+=' good';if(session.checked&&session.sel===o.key&&o.key!==q.correct)c+=' bad';return `<button class="${c}" onclick="pickTrain('${o.key}')" ${session.checked?'disabled':''}><span class="letter">${o.key}</span><span>${o.ro}${session.rus&&o.ru?`<div style="font-size:14px;color:#ccc;margin-top:6px">${o.ru}</div>`:''}</span></button>`}function pickTrain(k){if(session.checked)return;session.sel=k;session.checked=true;let x=st(session.q.id);x.seen++;x.last=Date.now();if(k===session.q.correct){x.right++;x.streak++}else{x.wrong++;x.streak=0}save();renderTrain()}
function examIntro(){render(`<div class="app">${top('<button class="icon" onclick="home()">‹</button>',t('exam'),'')}<div class="intro"><div class="big">20</div><p>${t('examSub')}</p><p><b>${t('pass')}</b></p><p class="muted">${t('note')}</p><button class="primary" onclick="startExam()">${t('start')}</button></div></div>`)}function startExam(){session={type:'exam',list:shuffle(Q).slice(0,20),i:0,ans:{},end:Date.now()+3600000,timer:null};session.timer=setInterval(tick,1000);renderExam()}function timeLeft(){let sec=Math.max(0,Math.ceil((session.end-Date.now())/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function tick(){if(!session||session.type!=='exam')return;if(Date.now()>=session.end)finishExam();else if($('#timer'))$('#timer').textContent='◷ '+timeLeft()}function renderExam(){let q=session.list[session.i];render(`<div class="app">${top('<button class="icon" onclick="exitExam()">‹</button>',`${String(session.i+1).padStart(2,'0')}/20`,heart(q,'renderExam()'))}<div class="progress"><i style="width:${(session.i+1)*5}%"></i></div><div class="timerrow"><span class="timer" id="timer">◷ ${timeLeft()}</span></div><div class="question">${q.question.ro}</div><div class="answers">${q.options.map(o=>`<button class="option ${session.ans[q.id]===o.key?'selected':''}" onclick="pickExam(${q.id},'${o.key}')"><span class="letter">${o.key}</span><span>${o.ro}</span></button>`).join('')}<div style="display:flex;gap:10px"><button class="next" onclick="moveExam(-1)" ${session.i===0?'disabled':''}>‹</button><button class="next" onclick="${session.i===19?'examGrid()':'moveExam(1)'}">${session.i===19?'☷':'›'}</button></div></div></div>`)}function pickExam(id,k){session.ans[id]=k;if(session.i<19)session.i++;renderExam()}function moveExam(d){session.i=Math.max(0,Math.min(19,session.i+d));renderExam()}function exitExam(){if(confirm(S.ui==='ru'?'Выйти из экзамена?':'Ieși din examen?')){clearInterval(session.timer);session=null;home()}}function examGrid(){render(`<div class="app">${top('<button class="icon" onclick="renderExam()">‹</button>',t('exam'),`<span class="timer" id="timer">◷ ${timeLeft()}</span>`)}<div class="intro"><div class="grid">${session.list.map((q,i)=>`<button class="${session.ans[q.id]?'done':''}" onclick="session.i=${i};renderExam()">${i+1}</button>`).join('')}</div><button class="primary" onclick="finishExam()">${t('finish')}</button></div></div>`)}function finishExam(){if(!session)return;clearInterval(session.timer);let right=session.list.filter(q=>session.ans[q.id]===q.correct).length;S.exams.push({date:Date.now(),right});save();let pass=right>=11;session=null;render(`<div class="app"><div class="intro"><div class="big">${right} / 20</div><h2>${pass?t('passed'):t('failed')}</h2><p class="muted">${t('pass')}</p><button class="primary" onclick="home()">${t('home')}</button></div></div>`)}
function showStats(){let seen=Q.filter(q=>st(q.id).seen).length,weak=Q.filter(q=>st(q.id).wrong>st(q.id).right).length,last=S.exams.length?S.exams[S.exams.length-1].right:null;render(`<div class="app">${top('<button class="icon" onclick="home()">‹</button>',t('stats'),'')}<div class="stats"><div class="stat"><div class="big">${seen} / 111</div><div class="muted">${S.ui==='ru'?'вопросов встречались в тренировке':'întrebări văzute'}</div></div><div class="stat">${S.ui==='ru'?'Слабые вопросы':'Întrebări dificile'}: <b>${weak}</b></div><div class="stat">${S.ui==='ru'?'Последний экзамен':'Ultimul examen'}: <b>${last===null?'—':last+'/20'}</b></div></div></div>`)}
window.addEventListener('error',e=>{document.body.innerHTML='<div class="error">Ошибка запуска: '+e.message+'</div>'});home();</script></body></html>
